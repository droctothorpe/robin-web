# Robin on Fly.io. See ADR 0002: one machine, SQLite on a volume.
app = "robin-web"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/robin.db"
  FRONTEND_DIST = "/app/frontend/dist"
  # Used in webhook messages so the link points back here.
  PUBLIC_BASE_URL = "https://robin-web.fly.dev"

[[mounts]]
  source = "robin_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Prototype mode: the machine sleeps when idle, so scheduled advances fire
  # on the next visit (once, per the catch-up rule). For a team that relies
  # on the schedule, set auto_stop_machines = "off" and min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # SQLite means exactly one machine.
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
